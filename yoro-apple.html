    .section-head{display:flex;align-items:end;justify-content:space-between;margin:27px 3px 11px}#overview .page-title{font-size:30px}#overview .subtitle{margin-bottom:0}#overview .section-head{margin-top:22px}.section-head h2{font-size:20px;letter-spacing:-.04em;margin:0}.link-btn{border:0;background:transparent;color:var(--blue);font-size:13px;padding:5px}.segmented{background:#e4e4e9;border-radius:10px;padding:2px;display:grid;grid-template-columns:1fr 1fr;margin-bottom:12px}.segmented button{border:0;background:transparent;color:#74747b;border-radius:8px;padding:7px 5px;font-size:11px;font-weight:700;transition:.25s var(--ease)}.segmented button.selected{background:#fff;color:var(--ink);box-shadow:0 1px 4px #0002}.list{background:var(--surface);border-radius:22px;overflow:hidden;box-shadow:0 2px 14px #00000008}.event{width:100%;border:0;background:transparent;text-align:left;color:inherit;padding:0;display:grid;grid-template-columns:50px 12px 1fr 18px;align-items:stretch}.event:active{background:#f4f4f7}.event time{font-size:11px;font-weight:750;padding:17px 0 0 15px}.rail{position:relative}.rail:before{content:"";position:absolute;left:5px;top:0;bottom:0;width:1px;background:#e4e4e8}.event:first-child .rail:before{top:21px}.event:last-child .rail:before{bottom:calc(100% - 22px)}.rail i{position:absolute;left:2px;top:19px;width:7px;height:7px;border-radius:50%;background:#fff;border:2px solid var(--blue);z-index:1}.event-main{padding:15px 7px;border-bottom:1px solid var(--line)}.event:last-child .event-main{border-bottom:0}.event-main b{display:block;font-size:13px}.event-main small{display:block;font-size:10px;color:var(--muted);margin-top:4px}.chev{color:#b2b2b7;align-self:center;font-size:18px}.day-content{display:none}.day-content.active{display:block;animation:fade .23s ease}@keyframes fade{from{opacity:0}to{opacity:1}}
    .lunch-block{margin-top:24px}.lunch-toggle{width:100%;border:0;background:var(--surface);color:inherit;border-radius:22px;padding:17px 16px;display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;text-align:left;box-shadow:0 2px 14px #00000008}.lunch-toggle strong{font-size:18px;letter-spacing:-.04em}.lunch-count{color:var(--muted);font-size:11px;font-weight:650}.lunch-chevron{color:#b2b2b7;font-size:20px;line-height:1;transition:transform .3s var(--ease)}.lunch-block.open .lunch-chevron{transform:rotate(90deg)}.lunch-panel{display:grid;grid-template-rows:0fr;opacity:0;margin-top:0;transition:grid-template-rows .38s var(--ease),opacity .25s,margin-top .38s var(--ease)}.lunch-block.open .lunch-panel{grid-template-rows:1fr;opacity:1;margin-top:12px}.lunch-inner{overflow:hidden}.food-index{background:var(--surface);border-radius:22px;overflow:hidden;box-shadow:0 2px 14px #00000008}.food-index+.food-index{margin-top:14px}.food-row{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;min-height:64px;padding:0 16px;color:inherit;text-decoration:none;border-bottom:1px solid var(--line);transition:background .18s,transform .18s}.food-row:last-child{border-bottom:0}.food-row:active{background:#f1f1f4;transform:scale(.992)}.food-no{color:#aaaab0;font-size:10px;font-weight:750}.food-name{font-size:14px;font-weight:700;letter-spacing:-.025em}.food-link{color:#b2b2b7;font-size:18px;font-weight:400;white-space:nowrap}.food-add{width:100%;border:0;background:transparent;color:var(--blue);font-size:12px;font-weight:700;padding:17px 0}
    .overlay{position:fixed;z-index:20;inset:0;background:#0000;pointer-events:none;transition:background .25s}.overlay.open{background:#0007;pointer-events:auto}.sheet{position:absolute;left:50%;bottom:0;width:min(500px,100%);transform:translate(-50%,110%);background:var(--bg);border-radius:26px 26px 0 0;padding:8px 17px max(22px,env(safe-area-inset-bottom));transition:transform .42s var(--ease);box-shadow:0 -15px 50px #0002;max-height:88dvh;overflow:auto}.overlay.open .sheet{transform:translate(-50%,0)}.grab{width:38px;height:5px;border-radius:99px;background:#c5c5ca;margin:2px auto 17px;touch-action:none}.sheet-head{display:flex;justify-content:space-between;align-items:center}.sheet-head h3{font-size:22px;letter-spacing:-.04em;margin:0}.sheet-close{border:0;background:#e2e2e7;color:#64646a;width:29px;height:29px;border-radius:50%;font-size:17px}.sheet-copy{font-size:12px;color:var(--muted);line-height:1.55;margin:7px 0 15px;overflow-wrap:anywhere}.sheet-copy:empty{display:none}.sheet-copy:empty+#sheetBody{margin-top:15px}.sheet-actions{background:#fff;border-radius:17px;overflow:hidden}.sheet-actions button,.sheet-actions a{border:0;border-bottom:1px solid var(--line);background:transparent;color:inherit;text-decoration:none;width:100%;padding:14px 15px;text-align:left;display:flex;justify-content:space-between;font-size:14px}.sheet-actions button:last-child,.sheet-actions a:last-child{border:0}.sheet-actions span{color:var(--blue)}.form{display:grid;gap:12px;margin-top:16px}.field{background:#fff;border-radius:14px;padding:9px 13px}.field label{display:block;color:var(--muted);font-size:9px;font-weight:700;letter-spacing:.06em;margin-bottom:5px}.field input{width:100%;border:0;outline:0;background:transparent;color:var(--ink);font-size:14px;padding:0}.primary{width:100%;border:0;background:var(--blue);color:#fff;border-radius:15px;padding:14px;font-size:14px;font-weight:750;margin-top:4px}.toast{position:fixed;z-index:30;left:50%;top:58px;transform:translate(-50%,-15px) scale(.92);opacity:0;background:#1d1d20;color:#fff;border-radius:999px;padding:9px 14px;font-size:11px;font-weight:700;box-shadow:0 8px 25px #0004;transition:.32s var(--ease);pointer-events:none;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
    .dark{--bg:#09090b;--surface:#1c1c1e;--ink:#f5f5f7;--muted:#a6a6ad;--line:#38383d;--shadow:0 10px 34px #0004;color:var(--ink);color-scheme:dark}.dark-page{background:#050506}.dark .segmented{background:#232326}.dark .segmented button.selected{background:#3a3a3c;box-shadow:0 1px 4px #0008}.dark .toolbar .icon-btn:active{background:#2c2c2e}.dark .field,.dark .sheet-actions{background:var(--surface)}.dark .sheet-close{background:#303034;color:#b8b8be}.dark .rail i{background:#1c1c1e}.dark .event:active,.dark .food-row:active{background:#29292d}.dark .food-no,.dark .food-link{color:#8e8e96}.dark .food-index,.dark .lunch-toggle{box-shadow:0 2px 16px #0005}
    @media(min-width:501px){body{padding:18px}.app{min-height:830px;border-radius:34px;box-shadow:0 25px 80px #0003}.sheet{bottom:18px;border-radius:26px}}

    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
<main class="app" id="app">
  <div class="status"><time id="clock">4:26</time><span class="system"><span class="signal"><i></i><i></i><i></i><i></i></span><span>5G</span><span class="battery"></span></span></div>
  <section class="screen active" id="overview">
    <div class="toolbar"><button class="icon-btn" aria-label="共有"><svg viewBox="0 0 24 24"><path d="M12 16V3m0 0L8 7m4-4 4 4M6 11H4.8A1.8 1.8 0 0 0 3 12.8v6.4A1.8 1.8 0 0 0 4.8 21h14.4a1.8 1.8 0 0 0 1.8-1.8v-6.4a1.8 1.8 0 0 0-1.8-1.8H18"/></svg></button><strong>旅のしおり</strong><button class="icon-btn" data-action="settings" aria-label="設定"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button></div>
    <h1 class="page-title">避暑の二日間。</h1><p class="subtitle">東京から養老渓谷へ。</p>
    <div class="section-head"><h2>旅程</h2><button class="link-btn" data-action="add-event">＋ 予定を追加</button></div>
    <div class="segmented" role="tablist"><button class="selected" data-day="1">8月23日（日）</button><button data-day="2">8月24日（月）</button></div>
    <div class="day-content active" data-day-content="1"><div class="list" id="events1"><button class="event" data-detail="東京駅に集合|" data-url="https://www.gransta.jp/" data-link-label="グランスタを開く"><time>10:00</time><span class="rail"><i></i></span><span class="event-main"><b>東京駅に集合</b><small>お弁当と軽食を購入</small></span><span class="chev">›</span></button><div class="event"><time>10:54</time><span class="rail"><i></i></span><span class="event-main"><b>東京を出発</b><small>五井駅(12:01着→ 12:33発)</small></span></div><div class="event"><time>13:54</time><span class="rail"><i></i></span><span class="event-main"><b>養老渓谷に到着</b><small>五井から1時間21分</small></span></div><button class="event" data-detail="SHINRA YORO VALLEY|" data-url="https://www.ikyu.com/00003250/?discsort=1&amp;lc=1&amp;ppc=2&amp;rc=1&amp;st=1" data-link-label="一休を開く"><time>15:00</time><span class="rail"><i></i></span><span class="event-main"><b>SHINRA YORO VALLEY</b><small>チェックイン</small></span><span class="chev">›</span></button></div></div>
    <div class="day-content" data-day-content="2"><div class="list" id="events2"><div class="event"><time>10:38</time><span class="rail"><i></i></span><span class="event-main"><b>養老渓谷を出発</b><small>五井駅(11:42着→ 12:19発)</small></span></div><div class="event"><time>13:22</time><span class="rail"><i></i></span><span class="event-main"><b>東京に到着</b><small>五井から1時間3分</small></span></div><button class="event" data-detail="Cafe 1894|" data-url="https://s.tabelog.com/tokyo/A1302/A130201/13096426/" data-link-label="食べログを開く"><time>15:15</time><span class="rail"><i></i></span><span class="event-main"><b>Cafe 1894</b><small>カフェ</small></span><span class="chev">›</span></button><button class="event" data-detail="TRATTORIA CREATTA|" data-url="https://s.tabelog.com/tokyo/A1302/A130201/13173597/" data-link-label="食べログを開く"><time>17:30</time><span class="rail"><i></i></span><span class="event-main"><b>TRATTORIA CREATTA</b><small>ディナー</small></span><span class="chev">›</span></button></div></div>
    <section class="lunch-block" id="lunchBlock"><button class="lunch-toggle" id="lunchToggle" aria-expanded="false" aria-controls="lunchPanel"><strong>ランチの候補</strong><span class="lunch-count" id="lunchCount">6件</span><span class="lunch-chevron">›</span></button><div class="lunch-panel" id="lunchPanel"><div class="lunch-inner"><div id="foodList"></div><button class="food-add" data-action="add-food">＋ 候補を追加</button></div></div></section>
  </section>
</main>
<div class="overlay" id="overlay"><section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="grab"></div><div class="sheet-head"><h3 id="sheetTitle">詳細</h3><button class="sheet-close" data-close aria-label="閉じる">×</button></div><p class="sheet-copy" id="sheetCopy"></p><div id="sheetBody"></div></section></div><div class="toast" id="toast">保存しました</div>
<script>
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  const app=$('#app'),overlay=$('#overlay'),sheet=$('#sheet'),sheetTitle=$('#sheetTitle'),sheetCopy=$('#sheetCopy'),sheetBody=$('#sheetBody'),toast=$('#toast');
  const defaultFood=[
    {id:'moheji-marunouchi',type:'もへじ 丸ビル',genre:'もんじゃ',meta:'ジャンル：もんじゃ',url:'https://s.tabelog.com/tokyo/A1302/A130201/13284379/',saved:false},
    {id:'komatsuan-oazo',type:'小松庵総本家',genre:'蕎麦',meta:'ジャンル：蕎麦',url:'https://s.tabelog.com/tokyo/A1302/A130201/13025712/',saved:false},
    {id:'kamonka-kitte',type:'過門香 KITTE丸の内店',genre:'中華',meta:'グループ：その他',url:'https://s.tabelog.com/tokyo/A1302/A130201/13153391/',saved:false},
    {id:'saigon-marunouchi',type:'サイゴン 丸の内',genre:'ベトナム',meta:'グループ：その他',url:'https://s.tabelog.com/tokyo/A1302/A130201/13010573/',saved:false},
    {id:'basil-marunouchi',type:'バジル 丸の内',genre:'タイ',meta:'グループ：その他',url:'https://s.tabelog.com/tokyo/A1302/A130201/13271482/',saved:false},
    {id:'koko-head-cafe',type:'KOKO HEAD cafe',genre:'ハワイ',meta:'グループ：その他',url:'https://s.tabelog.com/tokyo/A1302/A130201/13284095/',saved:false}
  ];
  let food=JSON.parse(localStorage.getItem('yoro-food')||'null')||structuredClone(defaultFood),currentDay='1',toastTimer;
  const legacyFood=food.length===3&&food.every(x=>[1,2,3].includes(Number(x.id))&&!x.url);if(legacyFood)food=[];food=food.filter(x=>!['cafe-1894','trattoria-creatta','tamatoya-tokyo','kuuya-tokyo','kanda-yabusoba'].includes(String(x.id)));defaultFood.forEach(x=>{if(!food.some(y=>y.id===x.id))food.push(structuredClone(x))});const basil=food.find(x=>x.id==='basil-marunouchi');if(basil)basil.url='https://s.tabelog.com/tokyo/A1302/A130201/13271482/';const foodOrder=['moheji-marunouchi','komatsuan-oazo','kamonka-kitte','saigon-marunouchi','basil-marunouchi','koko-head-cafe'];food.sort((a,b)=>{const ai=foodOrder.indexOf(String(a.id)),bi=foodOrder.indexOf(String(b.id));return (ai<0?999:ai)-(bi<0?999:bi)});localStorage.setItem('yoro-food',JSON.stringify(food));
  const defaultGenres=Object.fromEntries(defaultFood.map(x=>[String(x.id),x.genre]));food.forEach(x=>{if(defaultGenres[String(x.id)])x.genre=defaultGenres[String(x.id)]});const komatsuan=food.find(x=>x.id==='komatsuan-oazo');if(komatsuan)komatsuan.type='小松庵総本家';localStorage.setItem('yoro-food',JSON.stringify(food));
  function buzz(){if(navigator.vibrate)navigator.vibrate(7)}
  function notify(t){clearTimeout(toastTimer);toast.textContent=t;toast.classList.add('show');toastTimer=setTimeout(()=>toast.classList.remove('show'),1900)}
  function setDark(on){app.classList.toggle('dark',on);overlay.classList.toggle('dark',on);document.body.classList.toggle('dark-page',on)}
  function openSheet(t,c,html){sheetTitle.textContent=t;sheetCopy.textContent=c;sheetBody.innerHTML=html||'';overlay.classList.add('open');document.body.style.overflow='hidden';buzz()}
  function closeSheet(){overlay.classList.remove('open');document.body.style.overflow=''}
  $$('[data-day]').forEach(b=>b.addEventListener('click',()=>{currentDay=b.dataset.day;$$('[data-day]').forEach(x=>x.classList.toggle('selected',x===b));$$('[data-day-content]').forEach(x=>x.classList.toggle('active',x.dataset.dayContent===currentDay));buzz()}));
  $('#lunchToggle').addEventListener('click',()=>{const open=$('#lunchBlock').classList.toggle('open');$('#lunchToggle').setAttribute('aria-expanded',String(open));buzz()});
  document.addEventListener('click',e=>{const d=e.target.closest('[data-detail]');if(d?.dataset.url){const [t]=d.dataset.detail.split('|'),url=d.dataset.url,label=d.dataset.linkLabel||'リンクを開く';openSheet(t,'','<div class="sheet-actions"><a href="'+url+'" target="_blank" rel="noopener">'+label+' <span>→</span></a></div>')}});
  function eventForm(){openSheet('予定を追加','選択中の日付へ新しい予定を追加します。','<form class="form" id="eventForm"><div class="field"><label>時刻</label><input name="time" type="time" required></div><div class="field"><label>予定名</label><input name="name" placeholder="例：渓谷を散策" required></div><div class="field"><label>メモ</label><input name="memo" placeholder="場所や予約情報"></div><button class="primary">予定を保存</button></form>');$('#eventForm').addEventListener('submit',e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));const el=document.createElement('div');el.className='event';el.innerHTML='<time>'+v.time+'</time><span class="rail"><i></i></span><span class="event-main"><b>'+escapeHTML(v.name)+'</b><small>'+escapeHTML(v.memo||'追加した予定')+'</small></span>';$('#events'+currentDay).append(el);closeSheet();notify('予定を追加しました')})}
  function foodForm(){openSheet('お店を追加','食べログURLと訪問予定をまとめて保存します。','<form class="form" id="foodForm"><div class="field"><label>店名</label><input name="type" placeholder="店名" required></div><div class="field"><label>訪問予定</label><input name="meta" placeholder="例：8/23 12:30"></div><div class="field"><label>食べログURL</label><input name="url" type="url" placeholder="https://tabelog.com/..."></div><button class="primary">お店を保存</button></form>');$('#foodForm').addEventListener('submit',e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));food.push({id:Date.now(),type:v.type,meta:v.meta||'訪問時刻未定',url:v.url,saved:false});saveFood();renderFood();closeSheet();notify('お店を追加しました')})}
  function escapeHTML(s){const x=document.createElement('span');x.textContent=s;return x.innerHTML}
  function saveFood(){localStorage.setItem('yoro-food',JSON.stringify(food))}
  function renderFood(){const monja=food.filter(x=>x.meta?.includes('もんじゃ')),soba=food.filter(x=>x.meta?.includes('蕎麦')),other=food.filter(x=>!x.meta?.includes('もんじゃ')&&!x.meta?.includes('蕎麦'));let n=0;$('#lunchCount').textContent=food.length+'件';$('#foodList').innerHTML=[monja,soba,other].filter(x=>x.length).map(group=>'<div class="food-index">'+group.map(x=>{n++;return '<a class="food-row" href="'+escapeHTML(x.url||'#')+'" '+(x.url?'target="_blank" rel="noopener"':'data-action="add-food"')+'><span class="food-no">'+String(n).padStart(2,'0')+'</span><span class="food-info"><span class="food-name">'+escapeHTML(x.type)+'</span>'+(x.genre?'<span class="food-tag">'+escapeHTML(x.genre)+'</span>':'')+'</span><span class="food-link">'+(x.url?'›':'＋')+'</span></a>'}).join('')+'</div>').join('')}
  $$('[data-action]').forEach(b=>b.addEventListener('click',()=>{const a=b.dataset.action;if(a==='settings')openSheet('設定','','<div class="sheet-actions"><button data-action="toggle-dark">ダーク表示 <span>切替</span></button><button data-action="reset-demo">入力内容を初期化 <span>›</span></button></div>');if(a==='add-event')eventForm();if(a==='add-food')foodForm()}));
  document.addEventListener('click',e=>{const a=e.target.closest('[data-action]')?.dataset.action;if(a==='toggle-dark'){const on=!app.classList.contains('dark');setDark(on);localStorage.setItem('yoro-dark',on);notify(on?'ダーク表示にしました':'ライト表示にしました')}if(a==='reset-demo'){localStorage.removeItem('yoro-food');food=[...defaultFood];renderFood();closeSheet();notify('初期状態に戻しました')}});
  $$('[data-close]').forEach(b=>b.addEventListener('click',closeSheet));overlay.addEventListener('click',e=>{if(e.target===overlay)closeSheet()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
  let dragY=0;$('.grab').addEventListener('pointerdown',e=>{dragY=e.clientY;$('.grab').setPointerCapture(e.pointerId)});$('.grab').addEventListener('pointerup',e=>{if(e.clientY-dragY>65)closeSheet()});
  setDark(localStorage.getItem('yoro-dark')==='true');renderFood();
</script>
</body>
